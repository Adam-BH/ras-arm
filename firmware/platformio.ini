; PlatformIO: "pio run -e uno" builds for the arm, "pio test -e native" runs the tests on your PC

[env:uno]
platform  = atmelavr
board     = uno
framework = arduino
build_flags = -Os -Wall -mcall-prologues   ; shared register save/restore: ~1 KB less flash
monitor_speed = 115200

[env:native]
platform = native
build_flags = -std=c11 -Wall -Wextra -lm -DNATIVE
build_src_filter = +<*> -<main.cpp> -<1_hal/hal_avr.cpp>
test_build_src = yes
