name: CI
on: [push, pull_request]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Golden IK vectors are up to date
        run: python3 tools/ik_reference.py && git diff --exit-code firmware/test pysim/tests/ik_vectors.json
      - name: Build for the UNO
        run: pio run -e uno
        working-directory: firmware
      - name: Native tests (fake robot)
        run: pio test -e native
        working-directory: firmware

  pysim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pysim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pysim/requirements.txt
      - run: pip install pybullet numpy opencv-python-headless pyserial pytest
      - name: Model vs firmware and design book, the cycle and its faults on physics, serial port, vision
        run: pytest tests -q
      - name: Headless demo (RUN cycle with a slip, vision sort, keyframes)
        run: python run_sim.py demo --headless --quiet --fail-pick
