# ros2_control in Gazebo. Joint names and units = the firmware's (rad, finger = grip opening / 2 in m).
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [J1, J2, J3, J4, J5, J6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

gripper_controller:                # timed like the firmware's GRIP (no jump past the speed limit)
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [grip_left]            # grip_right mimics it
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
